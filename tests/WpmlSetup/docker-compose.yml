# The database of the WPML suite (tests/Wpml, tests/Cases/Wpml) and its web server. The twin of
# tests/WpSetup's, on its own ports and project, so both suites can run side by side.
#
#   docker compose -f tests/WpmlSetup/docker-compose.yml up -d --wait --build   (composer test:wpml:db)
#   composer test:wpml
#   docker compose -f tests/WpmlSetup/docker-compose.yml down                    (data is in tmpfs: gone)
#
# The web server answers http://127.0.0.1:18091 as the test site (Host: example.org): the same
# WordPress, plugins, wp-content and database the PHPUnit run uses. It sees what a test COMMITTED —
# a test's own transaction is invisible to another connection (tests/Support/WebRequests.php).
name: fabrement-lite-wpml-tests
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress_wpml_test
    ports:
      - "127.0.0.1:14307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: ../WebServer
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:18091:80"
    volumes:
      - ../../vendor/johnpbloch/wordpress-core:/var/www/html:ro
      - ./web/wp-config.php:/var/www/wp-config.php:ro
      - ./web/mu-plugins:/var/www/web-mu-plugins:ro
      # wp-tests-config.php keeps wp-content in the system temp folder (TEMP on Windows).
      - ${FABREMENT_WPML_CONTENT_DIR:-${TEMP:-/tmp}/fabrement-lite-wpml-tests/wp-content}:/var/www/content
      # One mount per plugin: the runtime folder holds junctions, which a container cannot follow.
      - ../..:/var/www/plugins/fabrement:ro
      - ../../vendor/wp-plugins/contact-form-7:/var/www/plugins/contact-form-7:ro
      - ../../vendor/wp-plugins/wordpress-seo:/var/www/plugins/wordpress-seo:ro
      - ../../../runtime/lite-wp-plugins/sitepress-multilingual-cms:/var/www/plugins/sitepress-multilingual-cms:ro
      - ../../../runtime/lite-wp-plugins/wp-seo-multilingual:/var/www/plugins/wp-seo-multilingual:ro
      - ../../../runtime/lite-wp-plugins/wpml-string-translation:/var/www/plugins/wpml-string-translation:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 2s
      timeout: 5s
      retries: 30
