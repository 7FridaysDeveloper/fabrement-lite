# One WordPress site, over HTTP and HTTPS. Core is mounted read-only (no .htaccess can be written
# into it), so WordPress's standard .htaccess rules are here instead — the same rules, including
# the one that hands the Authorization header to PHP (application passwords, OAuth).
<Directory /var/www/html>
    AllowOverride None
    Require all granted
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </IfModule>
</Directory>

<VirtualHost *:80>
    ServerName example.org
    DocumentRoot /var/www/html
    ErrorLog /dev/stderr
    CustomLog /dev/null combined
</VirtualHost>

<VirtualHost *:443>
    ServerName example.org
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/site.crt
    SSLCertificateKeyFile /etc/ssl/private/site.key
    ErrorLog /dev/stderr
    CustomLog /dev/null combined
</VirtualHost>
